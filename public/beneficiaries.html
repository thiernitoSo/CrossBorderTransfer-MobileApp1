<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipients - SendAfrika</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Beneficiaries Page Styles */
        .recipient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .recipient-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            transition: var(--transition);
            position: relative;
        }
        
        .recipient-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        
        .recipient-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .recipient-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            margin-right: 15px;
        }
        
        .recipient-name {
            flex: 1;
        }
        
        .recipient-name h3 {
            margin: 0 0 5px;
            font-size: 18px;
        }
        
        .recipient-country {
            display: flex;
            align-items: center;
            color: var(--text-light);
            font-size: 14px;
        }
        
        .recipient-country .flag {
            margin-right: 5px;
            font-size: 16px;
        }
        
        .recipient-info {
            margin-top: 15px;
            font-size: 14px;
        }
        
        .info-row {
            display: flex;
            margin-bottom: 8px;
        }
        
        .info-label {
            width: 120px;
            color: var(--text-light);
        }
        
        .info-value {
            flex: 1;
            font-weight: 500;
        }
        
        .recipient-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        
        .action-button {
            padding: 8px 16px;
            border-radius: var(--border-radius);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background-color: transparent;
        }
        
        .action-button:hover {
            background-color: var(--background-light);
        }
        
        .action-button.primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .action-button.primary:hover {
            background-color: var(--primary-dark);
        }
        
        .action-button i {
            margin-right: 5px;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
        
        .empty-state-icon {
            font-size: 48px;
            color: var(--text-light);
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        .empty-state p {
            color: var(--text-light);
            margin-bottom: 20px;
        }
        
        .search-filter {
            display: flex;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .search-bar {
            flex: 1;
            position: relative;
        }
        
        .search-bar input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
        }
        
        .search-bar i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }
        
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }
        
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <img src="https://i.imgur.com/3yFJNt5.png" alt="SendAfrika Logo">
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="send-money.html"><i class="fas fa-paper-plane"></i> Send Money</a></li>
                <li class="active"><a href="beneficiaries.html"><i class="fas fa-users"></i> Recipients</a></li>
                <li><a href="transactions.html"><i class="fas fa-history"></i> Transactions</a></li>
                <li><a href="support.html"><i class="fas fa-headset"></i> Support</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logout-button"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1>My Recipients</h1>
                <div class="user-profile">
                    <div class="user-avatar" id="user-initial"></div>
                    <div class="user-name" id="user-name">...</div>
                </div>
            </header>

            <section class="content-section">
                <div class="section-header">
                    <div>
                        <div class="breadcrumbs">
                            <a href="dashboard.html">Dashboard</a>
                            <i class="fas fa-chevron-right"></i>
                            <span>Recipients</span>
                        </div>
                        <h2>Manage Your Recipients</h2>
                        <p>Add, edit, or delete your money transfer recipients.</p>
                    </div>
                    <button class="btn-primary" id="add-recipient-btn"><i class="fas fa-plus"></i> Add New Recipient</button>
                </div>
                
                <div class="search-filter">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-recipients" placeholder="Search recipients...">
                    </div>
                </div>
                
                <div id="loading-container" class="loading-container">
                    <div class="loading-spinner"></div>
                </div>
                
                <div id="empty-state" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <h3>No Recipients Found</h3>
                    <p>You haven't added any recipients yet. Add a recipient to start sending money.</p>
                    <button class="btn-primary" id="empty-add-recipient-btn"><i class="fas fa-plus"></i> Add New Recipient</button>
                </div>
                
                <div id="recipients-grid" class="recipient-grid" style="display: none;">
                    <!-- Recipients will be loaded here -->
                </div>
            </section>
        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elements
            const addRecipientBtn = document.getElementById('add-recipient-btn');
            const emptyAddRecipientBtn = document.getElementById('empty-add-recipient-btn');
            const loadingContainer = document.getElementById('loading-container');
            const emptyState = document.getElementById('empty-state');
            const recipientsGrid = document.getElementById('recipients-grid');
            const searchInput = document.getElementById('search-recipients');
            const userNameElement = document.getElementById('user-name');
            const userInitialElement = document.getElementById('user-initial');
            
            // Set user information from local storage
            const setUserInfo = () => {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                if (user && user.firstName) {
                    userNameElement.textContent = `${user.firstName} ${user.lastName || ''}`;
                    userInitialElement.textContent = user.firstName.charAt(0);
                }
            };
            
            // Get country name from country code
            const getCountryName = (countryCode) => {
                const countries = {
                    'GH': 'Ghana',
                    'NG': 'Nigeria',
                    'KE': 'Kenya',
                    'RW': 'Rwanda',
                    'SN': 'Senegal',
                    'CI': 'Côte d\'Ivoire',
                    'CM': 'Cameroon',
                    'ZA': 'South Africa',
                    'TZ': 'Tanzania',
                    'UG': 'Uganda',
                    'ET': 'Ethiopia',
                    'MA': 'Morocco'
                };
                return countries[countryCode] || countryCode;
            };
            
            // Get country flag from country code
            const getCountryFlag = (countryCode) => {
                const flags = {
                    'GH': '🇬🇭',
                    'NG': '🇳🇬',
                    'KE': '🇰🇪',
                    'RW': '🇷🇼',
                    'SN': '🇸🇳',
                    'CI': '🇨🇮',
                    'CM': '🇨🇲',
                    'ZA': '🇿🇦',
                    'TZ': '🇹🇿',
                    'UG': '🇺🇬',
                    'ET': '🇪🇹',
                    'MA': '🇲🇦'
                };
                return flags[countryCode] || '🌍';
            };
            
            // Format payment method for display
            const formatPaymentMethod = (method) => {
                switch (method) {
                    case 'bank':
                        return 'Bank Transfer';
                    case 'mobile_money':
                        return 'Mobile Money';
                    case 'cash_pickup':
                        return 'Cash Pickup';
                    default:
                        return method;
                }
            };
            
            // Create recipient card
            const createRecipientCard = (recipient) => {
                const card = document.createElement('div');
                card.className = 'recipient-card';
                
                const initials = recipient.firstName.charAt(0) + recipient.lastName.charAt(0);
                
                card.innerHTML = `
                    <div class="recipient-header">
                        <div class="recipient-avatar">${initials}</div>
                        <div class="recipient-name">
                            <h3>${recipient.firstName} ${recipient.lastName}</h3>
                            <div class="recipient-country">
                                <span class="flag">${getCountryFlag(recipient.country)}</span>
                                <span>${getCountryName(recipient.country)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="recipient-info">
                        <div class="info-row">
                            <span class="info-label">Phone:</span>
                            <span class="info-value">${recipient.phoneNumber}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Payment:</span>
                            <span class="info-value">${formatPaymentMethod(recipient.paymentMethod)}</span>
                        </div>
                        ${recipient.paymentMethod === 'bank' ? `
                            <div class="info-row">
                                <span class="info-label">Bank:</span>
                                <span class="info-value">${recipient.bankName || 'N/A'}</span>
                            </div>
                        ` : ''}
                        ${recipient.paymentMethod === 'mobile_money' ? `
                            <div class="info-row">
                                <span class="info-label">Provider:</span>
                                <span class="info-value">${recipient.mobileMoneyProvider || 'N/A'}</span>
                            </div>
                        ` : ''}
                        <div class="info-row">
                            <span class="info-label">Relationship:</span>
                            <span class="info-value">${recipient.relationship}</span>
                        </div>
                    </div>
                    <div class="recipient-actions">
                        <button class="action-button edit-button" data-id="${recipient.id}">
                            <i class="fas fa-pencil-alt"></i> Edit
                        </button>
                        <button class="action-button primary send-button" data-id="${recipient.id}">
                            <i class="fas fa-paper-plane"></i> Send Money
                        </button>
                    </div>
                `;
                
                return card;
            };
            
            // Load recipients from API
            const loadRecipients = async () => {
                try {
                    loadingContainer.style.display = 'flex';
                    emptyState.style.display = 'none';
                    recipientsGrid.style.display = 'none';
                    
                    const response = await fetch('/api/beneficiaries', {
                        method: 'GET',
                        credentials: 'include'
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to load recipients');
                    }
                    
                    const recipients = await response.json();
                    
                    loadingContainer.style.display = 'none';
                    
                    if (recipients.length === 0) {
                        emptyState.style.display = 'block';
                    } else {
                        recipientsGrid.style.display = 'grid';
                        renderRecipients(recipients);
                    }
                } catch (error) {
                    loadingContainer.style.display = 'none';
                    emptyState.style.display = 'block';
                    console.error('Failed to load recipients:', error);
                }
            };
            
            // Render recipients to grid
            const renderRecipients = (recipients) => {
                recipientsGrid.innerHTML = '';
                
                recipients.forEach(recipient => {
                    const card = createRecipientCard(recipient);
                    recipientsGrid.appendChild(card);
                });
                
                // Add event listeners to buttons
                document.querySelectorAll('.edit-button').forEach(button => {
                    button.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        window.location.href = `edit-beneficiary.html?id=${id}`;
                    });
                });
                
                document.querySelectorAll('.send-button').forEach(button => {
                    button.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        window.location.href = `send-money.html?beneficiaryId=${id}`;
                    });
                });
            };
            
            // Filter recipients by search term
            const filterRecipients = async (searchTerm) => {
                try {
                    const response = await fetch('/api/beneficiaries', {
                        method: 'GET',
                        credentials: 'include'
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to load recipients');
                    }
                    
                    let recipients = await response.json();
                    
                    if (searchTerm) {
                        searchTerm = searchTerm.toLowerCase();
                        recipients = recipients.filter(recipient => 
                            recipient.firstName.toLowerCase().includes(searchTerm) ||
                            recipient.lastName.toLowerCase().includes(searchTerm) ||
                            getCountryName(recipient.country).toLowerCase().includes(searchTerm) ||
                            recipient.phoneNumber.includes(searchTerm)
                        );
                    }
                    
                    loadingContainer.style.display = 'none';
                    
                    if (recipients.length === 0) {
                        emptyState.style.display = 'block';
                        recipientsGrid.style.display = 'none';
                    } else {
                        emptyState.style.display = 'none';
                        recipientsGrid.style.display = 'grid';
                        renderRecipients(recipients);
                    }
                } catch (error) {
                    loadingContainer.style.display = 'none';
                    emptyState.style.display = 'block';
                    console.error('Failed to filter recipients:', error);
                }
            };
            
            // Add event listener to search input
            searchInput.addEventListener('input', function() {
                filterRecipients(this.value);
            });
            
            // Add event listeners to add recipient buttons
            addRecipientBtn.addEventListener('click', function() {
                window.location.href = 'add-beneficiary.html';
            });
            
            emptyAddRecipientBtn.addEventListener('click', function() {
                window.location.href = 'add-beneficiary.html';
            });
            
            // Logout functionality
            document.getElementById('logout-button').addEventListener('click', async function(event) {
                event.preventDefault();
                
                try {
                    const response = await fetch('/api/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });
                    
                    if (response.ok) {
                        // Clear any user data from local storage
                        localStorage.removeItem('user');
                        // Redirect to login page
                        window.location.href = '/';
                    } else {
                        throw new Error('Logout failed');
                    }
                } catch (error) {
                    console.error('Logout error:', error);
                    alert('Failed to logout. Please try again.');
                }
            });
            
            // Initialize user info
            setUserInfo();
            
            // Load recipients
            loadRecipients();
        });
    </script>
</body>
</html>
